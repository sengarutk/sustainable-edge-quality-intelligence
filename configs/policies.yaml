# Inspection regimes compared in the study. All numerical operating points live in
# data/raw/source_registry.csv; this file only defines structure.
#
# kind: none   -> no inspection; every defect escapes
#       manual -> 100% manual end-of-line visual inspection (no edge AI)
#       ai     -> continuous edge AI inspection with detect-and-divert
# ai_tiers are the alert-policy ladder measured in Paper A (BASELINE, EMA_ONLY, EMA_KOFN,
# FULL_POLICY); external_baselines are Paper A's textbook alarm baselines (DELAY_TIMER,
# EMA_HYSTERESIS, DECISION_FUSION), evaluated as alternatives to the full policy. For every AI
# regime the false-alert rate, alerts per defect, glare alerts, delay and recall loss are
# imported from Paper A (registry rows scoped policy:<regime>). persistence marks the regimes
# whose alarm needs several frames of evidence (descriptive; the recall loss is imported per regime).
baselines:
  N0_NoInspection:
    kind: none
    label: "N0 no inspection"
  L0_Manual:
    kind: manual
    label: "L0 manual EoL"
ai_tiers:
  B0_Raw:
    label: "B0 single-frame threshold"
    persistence: false
  B1_EMA:
    label: "B1 smoothing"
    persistence: false
  B2_EMA_kofN:
    label: "B2 smoothing + k-of-N"
    persistence: true
  B3_Full_Policy:
    label: "B3 full policy (latch)"
    persistence: true
external_baselines:
  E1_Delay_Timer:
    label: "E1 delay-timer"
    persistence: true
  E2_EMA_Hysteresis:
    label: "E2 EMA + hysteresis"
    persistence: false
  E3_Decision_Fusion:
    label: "E3 decision fusion"
    persistence: true
