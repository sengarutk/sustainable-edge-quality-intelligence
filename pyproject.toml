[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sustainable-edge-quality-intelligence"
version = "0.3.0"
description = "Measured edge-inference energy versus quality-driven carbon, material and workload effects of AI defect inspection"
authors = [{ name = "Utkarsh Sengar", email = "cs23bt026@iitdh.ac.in" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
bench = ["torch>=2.0", "torchvision>=0.15", "nvidia-ml-py>=12.535"]
dev = ["pytest>=7.4", "sympy>=1.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
