[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sustainable-edge-quality-intelligence"
version = "0.1.0"
description = "Quantifying Material, Energy, Carbon, and Workload Trade-offs in Edge Inspection"
authors = [{name = "Utkarsh Sengar", email = "cs23b026@iitdh.ac.in"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pytest>=7.4.0",
    "psutil>=5.9.0",
    "pynvml>=11.5.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]