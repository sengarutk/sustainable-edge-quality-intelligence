name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  reproduce:
    name: Tests and zero-drift reproduction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Unit, invariant and reproducibility tests
        run: pytest -v

      - name: Regenerate every result from the committed registry and measurements
        run: |
          for s in 03c_import_jetson 02_validate_sources 04_run_scenarios 05_run_sensitivity 06_run_monte_carlo \
                   07_run_break_even 07b_run_operating_points 08_generate_figures 09_generate_tables 10_generate_macros; do
            python scripts/$s.py
          done
          python scripts/sync_paper_assets.py

      - name: Fail on any drift in data, results, tables or macros
        # Figures are excluded: rasterisation can differ across FreeType builds. LaTeX outputs must be
        # byte-identical; numeric tables must agree to 1e-6 (see scripts/check_drift.py).
        run: python scripts/check_drift.py

  paper:
    name: Compile manuscript
    runs-on: ubuntu-latest
    needs: reproduce
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
      - uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/main.pdf
