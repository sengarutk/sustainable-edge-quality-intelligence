name: CI Regression & Governance Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  regression-gate:
    name: Pytest & Empirical Claims Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version:  3.13
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Execute pytest regression gate
        run: |
          pytest -v tests/ --maxfail=1

      - name: Verify empirical claims and numerical assertions (Script 11)
        run: |
          python scripts/11_validate_paper_claims.py

      - name: Verify asset synchronization and zero-drift working tree
        run: |
          python scripts/sync_paper_assets.py
          git diff --exit-code
